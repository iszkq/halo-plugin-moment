name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x ./gradlew

      - name: Build Plugin
        run: ./gradlew clean build

      - name: Inspect build outputs
        run: ls -lah build/libs

      - name: Verify packaged front-end resources
        run: |
          JAR_PATH=$(ls build/libs/*.jar | head -n 1)
          jar tf "$JAR_PATH" | grep 'frontend/moments-app.html'
          jar tf "$JAR_PATH" | grep 'frontend/moments-app.css'
          jar tf "$JAR_PATH" | grep 'frontend/moments-app.js'

      - name: Upload Jar Artifact
        uses: actions/upload-artifact@v4
        with:
          name: halo-plugin-moment-ci-artifact
          path: build/libs/*.jar
          if-no-files-found: error
